# =============================================================
# 収益還元クン v0.1  前提条件ファイル (assumptions.yaml)
# -------------------------------------------------------------
# 【重要】
#   - 本ツールは不動産鑑定評価ではありません。
#   - 出力は「収益試算値」であり「収益価格」ではありません。
#   - 不明な項目は推測で埋めず、必ず null のままにしてください。
#     null の項目は missing_info.md に欠損として記録されます。
# =============================================================

# --- 対象物件の基本情報 -------------------------------------
物件:
  名称: "ダミー物件A（収益還元クン サンプル）"
  所在地: "東京都〇〇区〇〇 1-2-3"
  構造: "鉄筋コンクリート造"
  延床面積_m2: 2400.0
  建築時期: null            # 不明 → 欠損として扱う

# --- 直接還元法のパラメータ ---------------------------------
# 還元利回り（キャップレート）。小数で指定（例: 4.5% → 0.045）
還元利回り: 0.045

# 空室・貸倒れ損失率。小数で指定（例: 5% → 0.05）
空室損失率: 0.05

# --- 運営費用（円/年） --------------------------------------
# 各項目は年額（円）で指定する。
# 不明な費用は null とし、勝手に補完しないこと。
# null の項目は欠損として記録され、その分は運営費用に算入されない
# （＝収益試算値が過大に出る可能性がある旨が警告される）。
運営費用:
  管理委託費: null          # 不明 → 欠損
  水道光熱費: 1200000
  維持修繕費: 1800000
  租税公課: 3500000
  損害保険料: 400000
  その他費用: 600000

# 資本的支出（CAPEX）控除額（円/年）。直接還元の純収益から控除する。
資本的支出: 1000000

# --- 付帯収入（オプション・GPI算入制御） ----------------------
# include_in_gpi: false（デフォルト）= 現行挙動を維持（GPI = 賃料 + 共益費のみ）
# include_in_gpi: true = columns に指定した収入を GPI に算入する
# 有効な columns キー: water（水道代）/ parking（駐車場収入）/ other_income（その他収入）
# 【注意】水道代（収入）と運営費用の水道光熱費（費用）は別管理・混入しません
optional_income:
  include_in_gpi: false
  columns: []

# --- 感応度分析の設定 ---------------------------------------
# 還元利回りは「絶対値の増減」（例: -0.005 = -0.5pt）
# NOI は「変動率」（例: -0.10 = -10%）
感応度分析:
  還元利回り変動幅: [-0.005, -0.0025, 0.0, 0.0025, 0.005]
  NOI変動率: [-0.10, -0.05, 0.0, 0.05, 0.10]
